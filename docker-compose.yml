version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polaris-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - COPERNICUS_CLIENT_ID=${COPERNICUS_CLIENT_ID:-}
      - COPERNICUS_CLIENT_SECRET=${COPERNICUS_CLIENT_SECRET:-}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=/api
    container_name: polaris-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
