# POLARIS — Render Blueprint (100% Free Plan)
# Defines both backend and frontend services.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── 1. POLARIS Backend (FastAPI Web Service) ──────────────────────────────
  - type: web
    name: polaris-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python run_server.py
    plan: free
    envVars:
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: COPERNICUS_CLIENT_ID
        sync: false   # Set manually in Render dashboard
      - key: COPERNICUS_CLIENT_SECRET
        sync: false   # Set manually in Render dashboard

  # ── 2. POLARIS Frontend (React + Vite Static Site) ────────────────────────
  - type: web
    name: polaris-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # Set to https://polaris-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
